  - id: production-client
    title: A production-shaped client
    kind: pattern
    language: javascript
    summary: >-
      Retry only 429/500/503, honour Retry-After before exponential backoff, capture X-Request-Id on
      every response, 90s client timeout, throw a typed error carrying error.code and the request id.
    see: conventions/1lookup-conventions.yml
  - id: error-handler-python
    title: One handler, every endpoint
    kind: pattern
    language: python
    summary: >-
      RETRYABLE = {429, 500, 502, 503, 504}; branch on error["code"], raise TransientError with
      Retry-After for retryables and PermanentError otherwise.
  - id: signup-risk-gate
    title: Sign-up risk gate
    kind: recipe
    language: javascript
    operations: ['POST /api/v1/email', 'POST /api/v1/phone']
    summary: >-
      Fire the email and phone lookups in parallel; BLOCK if either recommendations.primary_action is
      BLOCK, REVIEW if the combined fraud_score exceeds 90, otherwise APPROVE.
  - id: bounded-concurrency
    title: Bounded concurrency
    kind: recipe
    language: javascript
    summary: >-
      Twenty workers off a shared queue keeps inside the limits and finishes a 10k list in minutes;
      above ~5k rows the docs direct you to a bulk job instead.
