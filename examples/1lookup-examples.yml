  - id: bulk-lifecycle
    title: The full bulk lifecycle
    kind: request
    language: curl
    operations:
      - 'POST /api/v1/bulk/jobs'
      - 'GET /api/v1/bulk/jobs/{job_id}'
      - 'GET /api/v1/bulk/jobs/{job_id}/results'
    code: |
      # 1. Submit. The Idempotency-Key makes the retry safe.
      curl -X POST https://app.1lookup.io/api/v1/bulk/jobs \
        -H "Authorization: Bearer $ONELOOKUP_API_KEY" \
        -H "Content-Type: application/json" \
        -H "Idempotency-Key: $(uuidgen)" \
        -d '{
          "type": "email_validation",
          "inputs": ["jane.doe@acme.com", "john.doe@example.com"],
          "webhook_url": "https://example.com/hooks/1lookup"
        }'

      # 2. Poll for progress.
      curl https://app.1lookup.io/api/v1/bulk/jobs/JOB_ID \
        -H "Authorization: Bearer $ONELOOKUP_API_KEY"

      # 3. Read rows, or download the signed CSV from results_url.
      curl "https://app.1lookup.io/api/v1/bulk/jobs/JOB_ID/results?limit=1000&offset=0" \
        -H "Authorization: Bearer $ONELOOKUP_API_KEY"
