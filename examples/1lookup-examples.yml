description: >-
  Request/response examples published by 1Lookup, captured verbatim. 1Lookup publishes no OpenAPI, so
  there are no in-spec `examples` for a scorer to read — but the reference itself is example-dense: every
  one of the 46 endpoints prints a runnable request in five languages (cURL, Node.js, Python, PHP, Go)
  and a real JSON response, and the core-concept pages print worked examples for the envelope, cost
  metadata, cache hits, errors, 429 headers, retry logic and webhook signature verification. This file
  is the index of that example surface plus the cross-cutting examples in full; per-endpoint payloads
  stay at the source rather than being copied 46 times.
coverage:
  endpoints_documented: 46
  endpoints_with_request_example: 46
  endpoints_with_response_example: 46
  languages: [curl, javascript, python, php, go]
  note: >-
    Counted from the reference's per-endpoint blocks, each of which carries a language tab set and a
    "Response" block. Language tabs are rendered client-side from one source per endpoint.
languages:
  - {id: curl, label: cURL}
  - {id: javascript, label: Node.js}
  - {id: python, label: Python}
  - {id: php, label: PHP}
  - {id: go, label: Go}
