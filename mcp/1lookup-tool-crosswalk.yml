description: >-
  Binding between 1Lookup's five published MCP tools and the REST operations behind them. IMPORTANT
  CAVEAT: 1Lookup publishes no OpenAPI/Swagger document, so the REST side of this crosswalk is keyed by
  the documented HTTP method + path (the docs expose no operationIds), and the MCP side is keyed by the
  tool names in the provider's machine-readable server card (tools/list is OAuth-gated, so no live
  inputSchema was observable). Neither side was inferred — both are transcribed from documents 1Lookup
  publishes. Refreshed 2026-08-14 against the rewritten reference (46 endpoints, two of them new) and
  the newly published server card.
surfaces:
  openapi:
    present: false
    note: >-
      No machine-readable spec found, re-probed 2026-08-14. app.1lookup.io/openapi.json and
      /swagger.json answer 200 with the Next.js HTML shell (soft-404); /api/openapi.json,
      /api/v1/openapi.json, /api/v1/swagger.json and /api-docs return 404; www.1lookup.io/openapi.json
      returns 404; api.1lookup.io does not resolve. The reference at https://app.1lookup.io/api is
      hand-authored, server-rendered HTML.
    reference: https://app.1lookup.io/api
  graphql:
    present: false
  mcp:
    url: https://app.1lookup.io/api/mcp
    gated: true
    gate: OAuth 2.1 bearer (tools/list returned 401 invalid_token on 2026-08-14)
    server_card: https://www.1lookup.io/.well-known/mcp/server-card.json
    manifest: mcp/1lookup-mcp.yml
crosswalk:
  - tool: validate_phone
    category: phone-validation
    rest: ['POST /api/v1/phone']
    binding: rest
    confidence: high
    note: Server card and API reference describe the same result shape (line type, carrier, DNC, fraud score).
  - tool: verify_email
    category: email-validation
    rest: ['POST /api/v1/email']
    binding: rest
    confidence: high
  - tool: ip_lookup
    category: ip-intelligence
    rest: ['POST /api/v1/ip']
    binding: rest
    confidence: high
  - tool: bulk_verify
    category: bulk
    rest: ['POST /api/v1/phone', 'POST /api/v1/email', 'POST /api/v1/ip']
    binding: composite
    confidence: medium
    note: >-
      CORRECTED 2026-08-14. The server card defines this as a synchronous call over "up to 50 phones,
      emails, or IPs" returning a per-item result array at 1 credit per item — i.e. a server-side
      fan-out of the three core single lookups, NOT the REST bulk-job lifecycle. It has no 1:1 REST
      equivalent: POST /api/v1/bulk/jobs is asynchronous, takes up to 100,000 rows of one type, and
      returns a job id. An agent that needs more than 50 items, or any product other than phone/email/
      IP, must drop to REST.
  - tool: get_account
    category: account
    rest: ['GET /api/v1/account']
    binding: rest
    confidence: high
