  token_endpoint: https://app.1lookup.io/api/mcp/oauth/token
  registration_endpoint: https://app.1lookup.io/api/mcp/oauth/register
  grant_types: [authorization_code, refresh_token]
  code_challenge_methods: [S256]
  bearer_methods: [header]
