description: >-
  1Lookup ships a first-party hosted (remote) MCP connector at https://app.1lookup.io/api/mcp. It is a
  URL-only integration — no SDK, no pasted API key — authorized with OAuth 2.1 (authorization code +
  PKCE, dynamic client registration) against app.1lookup.io. NEW since 2026-08-09: the provider now
  publishes a machine-readable server card at https://www.1lookup.io/.well-known/mcp/server-card.json,
  so the tool list below is no longer transcribed from a marketing page — it is read from the
  provider's own JSON document (saved verbatim at well-known/1lookup-mcp-server-card.json). Tool calls
  spend the same universal credits as the REST API and honor the caller's plan limits.
