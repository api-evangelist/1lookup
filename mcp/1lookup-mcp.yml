tools:
- name: validate_phone
  description: >-
    Validate a phone number: confirms it is real and active, and returns line type, carrier, DNC
    status, and a fraud/risk score. Spends 1 credit.
  source: server-card
  rest_equivalent: POST /api/v1/phone
  credits: 1
- name: verify_email
  description: >-
    Verify an email address: checks that it exists and is deliverable, and flags disposable,
    role-based, and risky addresses. Spends 1 credit.
  source: server-card
  rest_equivalent: POST /api/v1/email
  credits: 1
- name: ip_lookup
  description: >-
    Look up an IP address: geolocation, connection type, and proxy/VPN/Tor/datacenter flags with a
    fraud/risk score. Spends 1 credit.
  source: server-card
  rest_equivalent: POST /api/v1/ip
  credits: 1
- name: bulk_verify
  description: >-
    Validate up to 50 phones, emails, or IPs in one call. Returns a per-item result array. Spends 1
    credit per item.
  source: server-card
  rest_equivalent: 'POST /api/v1/phone | /email | /ip, fanned out server-side'
  credits: 1 per item
  correction: >-
    The 2026-08-09 capture guessed this tool composed the REST bulk-job lifecycle. The server card is
    explicit that it is a synchronous 50-item call returning a result array — a different contract from
    POST /api/v1/bulk/jobs (100,000 rows, async, job-and-poll). Corrected here from the provider's own
    document.
- name: get_account
  description: 'Get the 1Lookup organization''s plan and remaining credits. Free, spends no credits.'
  source: server-card
  rest_equivalent: GET /api/v1/account
  credits: 0
access_notes:
- Access is described by the provider as read-only across the five tools.
- Calls bill against the caller's existing 1Lookup plan credits; no separate MCP fee.
- Identical lookups are served from the same 7-day cache as the REST API.
- Connector access can be revoked from the 1Lookup account at any time.
- Programmatic access is a paid feature; a 7-day trial is available.
- 'Everything beyond these five tools — the other ~41 REST products — is not reachable over MCP.'
