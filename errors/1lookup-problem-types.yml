description: >-
  1Lookup returns a consistent vendor JSON error envelope rather than RFC 9457 problem+json. The
  reference publishes the envelope shape, one worked example code, and the five HTTP status codes the
  API uses. It does NOT publish a full error-code registry — the `codes` list below contains only the
  code documented verbatim; it is not a complete catalog and must not be treated as one.
envelope:
  content_type: application/json
  example: |
    {
      "success": false,
      "error": {
        "message": "Invalid email format",
        "code": "INVALID_INPUT",
        "type": "api_error"
      }
    }
  fields:
    - name: success
      type: boolean
      description: Always false on an error response.
    - name: error.message
      type: string
      description: Human-readable description of what failed.
    - name: error.code
      type: string
      description: Machine-readable error code.
    - name: error.type
      type: string
      description: Error class (documented example value is api_error).
problems:
  - status: 400
    title: Bad Request
    description: The request was malformed or an input failed validation.
    remediation: Read error.error.message and correct the offending field before retrying.
  - status: 401
    title: Unauthorized
    description: Missing or invalid API key in the Authorization header.
    remediation: Check the Bearer token; rotate the key from the dashboard if compromised.
  - status: 402
    title: Insufficient Credits
    description: The organization's universal credit balance cannot cover the requested lookup.
    remediation: 'Top up or upgrade the plan; call GET /api/v1/account first to pace a large run.'
  - status: 429
    title: Rate Limited
    description: More than 1,000 requests in a minute for the organization.
    remediation: Back off exponentially and honor X-RateLimit-Reset.
  - status: 500
    title: Server Error
    description: Unexpected server-side failure.
    remediation: Retry with backoff; contact support if persistent.
