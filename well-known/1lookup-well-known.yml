      - {path: /.well-known/agent.json, status: 307, redirect: https://app.1lookup.io/login, parsed: false}
      - {path: /.well-known/mcp.json, status: 307, redirect: https://app.1lookup.io/login, parsed: false}
      - {path: /.well-known/mcp/server-card.json, status: 307, redirect: https://app.1lookup.io/login, parsed: false, note: 'The card is served from www, not app'}
