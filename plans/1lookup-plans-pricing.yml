policies:
  rollover: Unused subscription credits roll over for up to 3 months.
  auto_replenish: Optional; renews when the balance drops to 20 credits or fewer, with a 10% bonus.
  contracts: No contracts, no setup fees, no monthly minimums; upgrade/downgrade/cancel anytime.
  annual_discount: Equivalent of 2 months free.
