description: >-
  1Lookup is subscription-priced with a single universal credit balance spanning every product. Four
  published monthly tiers plus a custom enterprise tier; every plan starts with a 7-day free trial, and
  API access is included on all paid plans. Free, rate-limited browser tools are available without
  signup, but programmatic access is a paid feature. Unused subscription credits roll over for up to
  three months; annual billing is the equivalent of two months free.
