apis:
  - name: 1Lookup REST API
    description: >-
      RESTful API over HTTPS covering all 1Lookup products (phone/email/IP validation, fraud, enrichment,
      B2B data, SEO intelligence). API-key Bearer auth, JSON bodies, job-based bulk processing. Roughly
      47 documented operations, almost all POST, priced against a universal credit balance. No OpenAPI or
      other machine-readable contract is published.
    humanURL: https://app.1lookup.io/api
