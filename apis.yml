name: 1Lookup
description: >-
  1Lookup is a self-serve data verification and enrichment platform for SMBs, exposing more than forty
  products through a single REST API and one universal credit balance. It validates phone numbers (line
  type, carrier, HLR reachability, number portability, DNC status, spam/scam reputation, fraud score),
  email addresses (syntax, MX, deliverability, disposable and role-based detection) and IP addresses
  (geolocation, VPN/proxy/Tor and datacenter detection), then extends into B2B company and contact data
  (firmographics, prospect and account search, contact append, skip trace), SEO and web intelligence
  (domain authority, backlinks, keyword metrics, audience reports, SERP and website scraping), social and
  media lookups, property data and audio transcription. The same engine powers a web dashboard with batch
  CSV validation, roughly twenty-five free rate-limited browser tools, and a first-party hosted MCP
  connector authorized with OAuth 2.1 that gives AI agents five of the core tools without an API key.
