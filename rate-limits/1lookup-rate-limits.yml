specification: API Commons Rate Limits
specificationVersion: '0.1'
provider: 1Lookup
providerId: 1lookup
generated: '2026-08-14'
method: searched
created: '2026-08-09'
modified: '2026-08-14'
tags:
  - Rate Limiting
  - Data Validation
description: >-
  1Lookup publishes a four-tier rate-limit model, rewritten since the 2026-08-09 capture: standard
  lookups are 200 requests per 10 seconds PER API KEY, live-fetch lookups get 1,000 per minute per key,
  a hard ceiling of 500 requests per second (and 5,000 per 10 seconds) applies across everything, and
  account/monitoring calls are 1,000 per minute per organization. The previously recorded flat
  "1,000 requests per minute per organization" now describes only the account/monitoring tier. A 429
  carries Retry-After alongside the X-RateLimit-* set, and X-RateLimit-Reset is a Unix timestamp.
  Credits are a separate budget. Bulk-job status and result polling are excluded from the lookup budget.
sources:
  - https://app.1lookup.io/api
  - https://www.1lookup.io/pricing
posture: >-
  The provider frames limits as safety nets against runaway loops and leaked keys rather than traffic
  shaping, and invites customers whose workload needs more to ask.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  reset_format: Unix timestamp in seconds
  retry_after: Retry-After
  retry_after_format: seconds
  request_id: X-Request-Id
responseCodes:
  throttled: 429
  throttledCode: RATE_LIMIT_EXCEEDED
  insufficientCredits: 402
  insufficientCreditsCode: INSUFFICIENT_CREDITS
limits:
  - name: Standard lookups
    scope: api_key
    metric: requests_per_10_seconds
    limit: 200
    timeFrame: 10 seconds
    plans: all
    notes: The default tier for the single-shot validation and enrichment products.
  - name: Live-fetch lookups
    scope: api_key
    metric: requests_per_minute
    limit: 1000
    timeFrame: minute
    plans: all
    applies_to: [HLR, MNP, number type, business, property, company profile, LinkedIn, social endpoints]
    notes: These hold a connection open for seconds at a time, so they get their own window.
  - name: Hard ceiling (per second)
    scope: api_key
    metric: requests_per_second
    limit: 500
    timeFrame: second
    notes: Applies across everything, on top of the per-tier limits.
  - name: Hard ceiling (per 10 seconds)
    scope: api_key
    metric: requests_per_10_seconds
    limit: 5000
    timeFrame: 10 seconds
    notes: Applies across everything.
  - name: Account and monitoring
    scope: organization
    metric: requests_per_minute
    limit: 1000
    timeFrame: minute
    notes: 'GET /account and the job-change-monitor endpoints.'
  - name: Bulk job status and result polling
    scope: organization
    metric: requests_per_minute
    limit: -1
    timeFrame: minute
    notes: Free, and explicitly excluded from the lookup rate budget.
quotas:
  - name: Universal credits
    scope: organization
    metric: credits_per_month
    description: >-
      Separate from the request rate limits. Core validations (phone, email, IP, spam check, number
      type, SERP scraper) cost 1 credit; enrichment and intelligence products cost 2-86 credits. A 4xx
      validation error costs nothing, a cache hit costs nothing, and success-based products charge 0 on
      no match. Unused subscription credits roll over for up to 3 months.
    plans:
      - {plan: Starter, credits: 20000}
      - {plan: Growth, credits: 85000}
      - {plan: Professional, credits: 250000}
      - {plan: Enterprise, credits: 1000000}
      - {plan: Custom Enterprise, credits: '>1,000,000 (contact sales)'}
  - name: Bulk job size
    scope: request
    metric: rows_per_job
    limit: 100000
    notes: 'Exceeding it returns 400 INPUT_LIMIT_EXCEEDED. Whole job is credit-checked up front.'
  - name: Bulk results page size
    scope: request
    metric: rows_per_page
    limit: 1000
    default: 100
guidance:
  - Respect Retry-After before falling back to exponential backoff.
  - Keep concurrency bounded rather than firing a whole list at once; the docs' own sample uses 20 workers.
  - Retry 429, 500 and 503 only — every 4xx below 429 will fail again identically.
  - For anything above a few thousand records use one bulk job, which is immune to the rate limits.
  - Let the 7-day cache work; only send bypass_cache when freshness matters.
  - 'Check GET /api/v1/account before a long run.'
observed:
  probed: false
  note: >-
    Limits are transcribed from the documentation, not observed on the wire — every 1Lookup endpoint
    requires a paid API key, so there is no unauthenticated response to read headers from.
x-evidence:
  - url: https://app.1lookup.io/api
    http_status: 200
    fetched: '2026-08-14'
